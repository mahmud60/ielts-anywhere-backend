name: Deploy IELTS Pro

on:
  push:
    branches:
      - main
    paths:
      - '**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: ${{ secrets.GCP_REGION }}
  REGISTRY: us-central1-docker.pkg.dev

jobs:

  # ── 0. Run tests — gates the build, migrations, and every deploy ───────────
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test deps
        run: pip install pytest anthropic==0.94.0 "SQLAlchemy==2.0.49" "pydantic==2.12.5" "pydantic-settings==2.13.1"
      - name: Run tests
        env:
          # Dummy values so app.* imports resolve; tests are pure and hit no I/O.
          DATABASE_URL: postgresql+asyncpg://u:p@localhost/test
          ANTHROPIC_API_KEY: test-key
          REDIS_URL: redis://localhost:6379/0
        run: python -m pytest tests/ -q

  # ── 1. Build and push FastAPI image ────────────────────────────────────────
  build-api:
    name: Build FastAPI image
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read
      id-token: write

    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Log in to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Generate image tag
        id: tag
        run: echo "tag=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Build and push FastAPI image
        run: |
          docker build \
            -f Dockerfile \
            -t ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/ielts-images/fastapi:${{ steps.tag.outputs.tag }} \
            -t ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/ielts-images/fastapi:latest \
            .

          docker push ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/ielts-images/fastapi:${{ steps.tag.outputs.tag }}
          docker push ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/ielts-images/fastapi:latest

  # ── 1b. Run DB migrations — gates the API + Celery deploys ─────────────────
  migrate:
    name: Run DB migrations
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install migration deps
        run: pip install "alembic==1.18.4" "SQLAlchemy==2.0.49" "psycopg2-binary==2.9.11" "pydantic==2.12.5" "pydantic-settings==2.13.1" "python-dotenv==1.2.2"
      - name: alembic upgrade head
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
        run: alembic upgrade head

  # ── 2. Deploy FastAPI to Cloud Run ─────────────────────────────────────────
  deploy-api:
    name: Deploy FastAPI to Cloud Run
    runs-on: ubuntu-latest
    needs: [build-api, migrate]
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        # NOTE ON --set-env-vars: it is a COMMA-separated list, so no value here
        # may contain a comma or gcloud will read it as another variable. That is
        # why ALLOWED_ORIGINS is deliberately NOT passed: it is a comma-separated
        # list by nature, and passing it here would corrupt the whole flag. The
        # app falls back to the default list in app/core/config.py instead.
        run: |
          gcloud run deploy fastapi \
            --image=${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/ielts-images/fastapi:${{ needs.build-api.outputs.image_tag }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --min-instances=1 \
            --max-instances=10 \
            --memory=512Mi \
            --cpu=1 \
            --concurrency=80 \
            --timeout=60 \
            --set-env-vars=DATABASE_URL=${{ secrets.DATABASE_URL }},ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }},REDIS_URL=${{ secrets.REDIS_URL }},R2_ACCOUNT_ID=${{ secrets.R2_ACCOUNT_ID }},R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }},R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }},R2_BUCKET_NAME=${{ secrets.R2_BUCKET_NAME }},R2_PUBLIC_URL=${{ secrets.R2_PUBLIC_URL }},FIREBASE_SERVICE_ACCOUNT_B64=${{ secrets.FIREBASE_SERVICE_ACCOUNT_B64 }},LIVEKIT_API_KEY=${{ secrets.LIVEKIT_API_KEY }},LIVEKIT_API_SECRET=${{ secrets.LIVEKIT_API_SECRET }},LIVEKIT_URL=${{ secrets.LIVEKIT_URL }},LISTENING_TIME_LIMIT=1800,READING_TIME_LIMIT=3600,WRITING_TIME_LIMIT=3600,SPEAKING_TIME_LIMIT=900,DEBUG=False,POSTHOG_API_KEY=${{ secrets.POSTHOG_API_KEY }},SENTRY_DSN=${{ secrets.SENTRY_DSN }},OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }},LEMONSQUEEZY_API_KEY=${{ secrets.LEMONSQUEEZY_API_KEY }},LEMONSQUEEZY_WEBHOOK_SECRET=${{ secrets.LEMONSQUEEZY_WEBHOOK_SECRET }},LEMONSQUEEZY_PRO_VARIANT_ID=${{ secrets.LEMONSQUEEZY_PRO_VARIANT_ID }} \
            --quiet

      - name: Print FastAPI URL
        run: |
          gcloud run services describe fastapi \
            --region=${{ env.REGION }} \
            --format="value(status.url)"

  # ── 3. Deploy Celery worker + Speaking agent to the shared VM ──────────────
  # These were two jobs against two VMs. They are now ONE job because both
  # services live on one box, share WorkingDirectory
  # /home/MAHMUD/ielts-anywhere-backend, and therefore share a single .env.
  # Keeping them as separate jobs would run them in parallel against that one
  # directory, where each truncating write to .env clobbers the other service's
  # keys and the two hard resets race on the same index.lock.
  deploy-vm:
    name: Deploy Celery + Speaking agent to VM
    runs-on: ubuntu-latest
    needs: [build-api, migrate]

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          SECRET_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_REDIS_URL: ${{ secrets.REDIS_URL }}
          SECRET_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SECRET_R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          SECRET_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          SECRET_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          SECRET_R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          SECRET_R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          SECRET_RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SECRET_POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          SECRET_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SECRET_LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          SECRET_LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          SECRET_LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          SECRET_DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          SECRET_GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          SECRET_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          host: ${{ secrets.VM_IP }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          envs: SECRET_DATABASE_URL,SECRET_REDIS_URL,SECRET_ANTHROPIC_API_KEY,SECRET_R2_ACCOUNT_ID,SECRET_R2_ACCESS_KEY_ID,SECRET_R2_SECRET_ACCESS_KEY,SECRET_R2_BUCKET_NAME,SECRET_R2_PUBLIC_URL,SECRET_RESEND_API_KEY,SECRET_POSTHOG_API_KEY,SECRET_SENTRY_DSN,SECRET_LIVEKIT_URL,SECRET_LIVEKIT_API_KEY,SECRET_LIVEKIT_API_SECRET,SECRET_DEEPGRAM_API_KEY,SECRET_GOOGLE_API_KEY,SECRET_OPENAI_API_KEY
          script: |
            set -e

            # 2G swap. Both services share this box now, so the headroom that
            # used to be agent-only insurance protects Celery grading too.
            # Guard on whether swap is ACTIVE, not on whether the file exists:
            # an interrupted setup leaves a 2G file present but unformatted, and
            # a file-exists guard then skips repair forever, silently running
            # with no swap. (Hit exactly this while provisioning the VM.)
            if ! swapon --show=NAME --noheadings | grep -q swapfile-agent; then
              sudo swapoff /swapfile-agent 2>/dev/null || true
              sudo rm -f /swapfile-agent
              sudo fallocate -l 2G /swapfile-agent
              sudo chmod 600 /swapfile-agent
              sudo mkswap /swapfile-agent
              sudo swapon /swapfile-agent
              grep -q swapfile-agent /etc/fstab || echo '/swapfile-agent none swap sw 0 0' | sudo tee -a /etc/fstab
            fi

            cd /home/MAHMUD/ielts-anywhere-backend
            git fetch origin main
            git reset --hard origin/main

            # ── ONE .env for BOTH services ────────────────────────────────
            # Written exactly once, here. Only the first line overwrites; every
            # other line appends. Both systemd units read this same file from
            # the shared WorkingDirectory.
            echo "DATABASE_URL=$SECRET_DATABASE_URL" > .env
            echo "REDIS_URL=$SECRET_REDIS_URL" >> .env
            echo "ANTHROPIC_API_KEY=$SECRET_ANTHROPIC_API_KEY" >> .env
            echo "R2_ACCOUNT_ID=$SECRET_R2_ACCOUNT_ID" >> .env
            echo "R2_ACCESS_KEY_ID=$SECRET_R2_ACCESS_KEY_ID" >> .env
            echo "R2_SECRET_ACCESS_KEY=$SECRET_R2_SECRET_ACCESS_KEY" >> .env
            echo "R2_BUCKET_NAME=$SECRET_R2_BUCKET_NAME" >> .env
            echo "R2_PUBLIC_URL=$SECRET_R2_PUBLIC_URL" >> .env
            echo "RESEND_API_KEY=$SECRET_RESEND_API_KEY" >> .env
            echo "POSTHOG_API_KEY=$SECRET_POSTHOG_API_KEY" >> .env
            echo "SENTRY_DSN=$SECRET_SENTRY_DSN" >> .env
            echo "LIVEKIT_URL=$SECRET_LIVEKIT_URL" >> .env
            echo "LIVEKIT_API_KEY=$SECRET_LIVEKIT_API_KEY" >> .env
            echo "LIVEKIT_API_SECRET=$SECRET_LIVEKIT_API_SECRET" >> .env
            echo "DEEPGRAM_API_KEY=$SECRET_DEEPGRAM_API_KEY" >> .env
            echo "GOOGLE_API_KEY=$SECRET_GOOGLE_API_KEY" >> .env
            echo "OPENAI_API_KEY=$SECRET_OPENAI_API_KEY" >> .env

            # ── Dependencies ──────────────────────────────────────────────
            pip3 install -r requirements.txt --user --quiet --no-cache-dir
            export PATH="$HOME/.local/bin:$PATH"

            if [ ! -f /home/MAHMUD/agent-venv/bin/python ]; then
              python3 -m venv /home/MAHMUD/agent-venv
            fi
            REQ_HASH=$(md5sum requirements.agent.txt | cut -d' ' -f1)
            HASH_FILE=/home/MAHMUD/agent-venv/.req-hash
            if [ ! -f "$HASH_FILE" ] || [ "$(cat $HASH_FILE)" != "$REQ_HASH" ]; then
              /home/MAHMUD/agent-venv/bin/pip install -r requirements.agent.txt --quiet
              echo "$REQ_HASH" > "$HASH_FILE"
            fi

            # ── Install both systemd units ────────────────────────────────
            # The Celery unit is generated with the deploy user and celery path
            # resolved LIVE. This VM's home and ~/.local/bin path are not safely
            # assumable, so hardcoding them in a checked-in unit file is fragile.
            # The unit makes the worker auto-restart on crash, broker outage,
            # OOM, or reboot; previously a nohup worker that died on a Redis blip
            # stayed dead until the next deploy, silently halting all writing
            # grading + feedback tips.
            RUN_USER=$(whoami)
            CELERY_BIN=$(command -v celery)
            [ -n "$CELERY_BIN" ] || { echo "celery not found on PATH after pip install"; exit 1; }
            printf '[Unit]\nDescription=IELTS Celery Worker (writing grading + feedback)\nAfter=network-online.target\nWants=network-online.target\nStartLimitIntervalSec=0\n\n[Service]\nType=simple\nUser=%s\nWorkingDirectory=/home/MAHMUD/ielts-anywhere-backend\nExecStart=%s -A app.tasks.grading.celery_app worker -B --loglevel=info --concurrency=2 --without-gossip --without-mingle --without-heartbeat\nRestart=always\nRestartSec=5\n\n[Install]\nWantedBy=multi-user.target\n' "$RUN_USER" "$CELERY_BIN" | sudo tee /etc/systemd/system/ielts-celery.service >/dev/null
            echo "Installed ielts-celery unit (User=$RUN_USER ExecStart=$CELERY_BIN)"

            sudo cp deploy/ielts-speaking-agent.service /etc/systemd/system/ielts-speaking-agent.service
            sudo systemctl daemon-reload
            sudo systemctl enable ielts-celery
            sudo systemctl enable ielts-speaking-agent

            # ── Stop both, then clear stale pre-systemd processes ─────────
            # Reap Celery by pidfile and the agent by PORT, never by name match:
            # this script contains both process-name strings, so a pkill -f would
            # SIGTERM the deploy shell itself (the exit-143 bug we hit before).
            sudo systemctl stop ielts-celery 2>/dev/null || true
            sudo systemctl stop ielts-speaking-agent 2>/dev/null || true
            kill "$(cat /tmp/celery.pid 2>/dev/null)" 2>/dev/null || true
            rm -f /tmp/celery.pid
            sudo fuser -k 8081/tcp 2>/dev/null || true
            rm -f /tmp/agent.pid
            sleep 3

            sudo systemctl reset-failed ielts-celery || true
            sudo systemctl reset-failed ielts-speaking-agent || true
            sudo systemctl start ielts-celery
            sudo systemctl start ielts-speaking-agent

            # ── Health checks: both must be genuinely running ─────────────
            sleep 6
            fail=0
            for svc in ielts-celery ielts-speaking-agent; do
              state=$(systemctl show -p SubState --value $svc)
              pid=$(systemctl show -p MainPID --value $svc)
              if [ "$state" = "running" ] && [ "$pid" != "0" ]; then
                echo "$svc active (PID $pid)"
              else
                echo "$svc NOT healthy (SubState=$state MainPID=$pid); recent logs:"
                sudo journalctl -u $svc -n 40 --no-pager || true
                fail=1
              fi
            done
            [ "$fail" = "0" ] || exit 1

            # FATAL broker check: require the worker to actually answer a ping,
            # which only succeeds once it is connected to Redis AND consuming.
            # The process-running check above cannot tell "connected" from "stuck
            # in a broker-retry loop" (broker_connection_max_retries=None keeps
            # the process alive forever), so without this a dead/unreachable
            # broker deploys green and grading silently stalls. Retry for ~60s
            # because the control queue is not ready for the first few seconds.
            ping_ok=""
            for i in $(seq 1 12); do
              if "$CELERY_BIN" -A app.tasks.grading.celery_app inspect ping 2>/dev/null | grep -q pong; then
                ping_ok=1; break
              fi
              sleep 5
            done
            if [ -n "$ping_ok" ]; then
              echo "Broker ping OK — worker is connected to Redis and consuming"
            else
              echo "Worker is up but never answered a broker ping in 60s — NOT connected to the broker. Recent logs:"
              sudo journalctl -u ielts-celery -n 40 --no-pager || true
              exit 1
            fi
