name: Deploy IELTS Pro

on:
  push:
    branches:
      - main
    paths:
      - '**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: ${{ secrets.GCP_REGION }}
  REGISTRY: us-central1-docker.pkg.dev

jobs:

  # ── 1. Build and push FastAPI image ────────────────────────────────────────
  build-api:
    name: Build FastAPI image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Log in to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Generate image tag
        id: tag
        run: echo "tag=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Build and push FastAPI image
        run: |
          docker build \
            -f Dockerfile \
            -t ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/ielts-images/fastapi:${{ steps.tag.outputs.tag }} \
            -t ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/ielts-images/fastapi:latest \
            .

          docker push ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/ielts-images/fastapi:${{ steps.tag.outputs.tag }}
          docker push ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/ielts-images/fastapi:latest

  # ── 2. Deploy FastAPI to Cloud Run ─────────────────────────────────────────
  deploy-api:
    name: Deploy FastAPI to Cloud Run
    runs-on: ubuntu-latest
    needs: build-api
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy fastapi \
            --image=${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/ielts-images/fastapi:${{ needs.build-api.outputs.image_tag }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --min-instances=1 \
            --max-instances=10 \
            --memory=512Mi \
            --cpu=1 \
            --concurrency=80 \
            --timeout=60 \
            --set-env-vars=DATABASE_URL=${{ secrets.DATABASE_URL }},ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }},REDIS_URL=${{ secrets.REDIS_URL }},R2_ACCOUNT_ID=${{ secrets.R2_ACCOUNT_ID }},R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }},R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }},R2_BUCKET_NAME=${{ secrets.R2_BUCKET_NAME }},R2_PUBLIC_URL=${{ secrets.R2_PUBLIC_URL }},FIREBASE_SERVICE_ACCOUNT_B64=${{ secrets.FIREBASE_SERVICE_ACCOUNT_B64 }},ALLOWED_ORIGINS=${{ secrets.ALLOWED_ORIGINS }},LIVEKIT_API_KEY=${{ secrets.LIVEKIT_API_KEY }},LIVEKIT_API_SECRET=${{ secrets.LIVEKIT_API_SECRET }},LIVEKIT_URL=${{ secrets.LIVEKIT_URL }},LISTENING_TIME_LIMIT=1800,READING_TIME_LIMIT=3600,WRITING_TIME_LIMIT=3600,SPEAKING_TIME_LIMIT=900,DEBUG=False \
            --quiet

      - name: Print FastAPI URL
        run: |
          gcloud run services describe fastapi \
            --region=${{ env.REGION }} \
            --format="value(status.url)"

  # ── 3. Deploy Celery to VM via SSH ──────────────────────────────────────────
  deploy-celery:
    name: Deploy Celery to VM
    runs-on: ubuntu-latest
    needs: build-api

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          SECRET_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_REDIS_URL: ${{ secrets.REDIS_URL }}
          SECRET_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SECRET_R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          SECRET_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          SECRET_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          SECRET_R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          SECRET_R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          SECRET_RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        with:
          host: ${{ secrets.VM_IP }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          envs: SECRET_DATABASE_URL,SECRET_REDIS_URL,SECRET_ANTHROPIC_API_KEY,SECRET_R2_ACCOUNT_ID,SECRET_R2_ACCESS_KEY_ID,SECRET_R2_SECRET_ACCESS_KEY,SECRET_R2_BUCKET_NAME,SECRET_R2_PUBLIC_URL,SECRET_RESEND_API_KEY
          script: |
            set -e
            cd /home/MAHMUD/ielts-anywhere-backend
            git fetch origin main
            git reset --hard origin/main

            echo "DATABASE_URL=$SECRET_DATABASE_URL" > .env
            echo "REDIS_URL=$SECRET_REDIS_URL" >> .env
            echo "ANTHROPIC_API_KEY=$SECRET_ANTHROPIC_API_KEY" >> .env
            echo "R2_ACCOUNT_ID=$SECRET_R2_ACCOUNT_ID" >> .env
            echo "R2_ACCESS_KEY_ID=$SECRET_R2_ACCESS_KEY_ID" >> .env
            echo "R2_SECRET_ACCESS_KEY=$SECRET_R2_SECRET_ACCESS_KEY" >> .env
            echo "R2_BUCKET_NAME=$SECRET_R2_BUCKET_NAME" >> .env
            echo "R2_PUBLIC_URL=$SECRET_R2_PUBLIC_URL" >> .env
            echo "RESEND_API_KEY=$SECRET_RESEND_API_KEY" >> .env

            pip3 install -r requirements.txt --user --quiet --no-cache-dir
            export PATH="$HOME/.local/bin:$PATH"
            kill $(cat /tmp/celery.pid) 2>/dev/null || true
            sleep 2
            rm -f /tmp/celery.pid
            nohup celery -A app.tasks.grading.celery_app worker \
              --loglevel=info \
              --concurrency=2 \
              --pidfile=/tmp/celery.pid \
              > /tmp/celery.log 2>&1 &
            sleep 3
            celery -A app.tasks.grading.celery_app inspect ping 2>/dev/null && echo "Celery deployed successfully" || echo "Celery may still be starting"

  # ── 4. Deploy Speaking Agent to VM ─────────────────────────────────────────
  deploy-agent:
    name: Deploy Speaking Agent to VM
    runs-on: ubuntu-latest
    needs: build-api

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          SECRET_LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          SECRET_LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          SECRET_LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          SECRET_DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          SECRET_GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          SECRET_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          host: 34.67.87.122
          username: MAHMUD
          key: ${{ secrets.AGENT_VM_SSH_KEY }}
          envs: SECRET_LIVEKIT_URL,SECRET_LIVEKIT_API_KEY,SECRET_LIVEKIT_API_SECRET,SECRET_DEEPGRAM_API_KEY,SECRET_GOOGLE_API_KEY,SECRET_OPENAI_API_KEY
          script: |
            set -e

            if [ ! -f /swapfile-agent ]; then
              sudo fallocate -l 2G /swapfile-agent
              sudo chmod 600 /swapfile-agent
              sudo mkswap /swapfile-agent
              sudo swapon /swapfile-agent
              echo '/swapfile-agent none swap sw 0 0' | sudo tee -a /etc/fstab
            fi

            cd /home/MAHMUD/ielts-anywhere-backend
            git fetch origin main
            git reset --hard origin/main

            echo "LIVEKIT_URL=$SECRET_LIVEKIT_URL" > .env
            echo "LIVEKIT_API_KEY=$SECRET_LIVEKIT_API_KEY" >> .env
            echo "LIVEKIT_API_SECRET=$SECRET_LIVEKIT_API_SECRET" >> .env
            echo "DEEPGRAM_API_KEY=$SECRET_DEEPGRAM_API_KEY" >> .env
            echo "GOOGLE_API_KEY=$SECRET_GOOGLE_API_KEY" >> .env
            echo "OPENAI_API_KEY=$SECRET_OPENAI_API_KEY" >> .env

            if [ ! -f /home/MAHMUD/agent-venv/bin/python ]; then
              python3 -m venv /home/MAHMUD/agent-venv
            fi
            REQ_HASH=$(md5sum requirements.agent.txt | cut -d' ' -f1)
            HASH_FILE=/home/MAHMUD/agent-venv/.req-hash
            if [ ! -f "$HASH_FILE" ] || [ "$(cat $HASH_FILE)" != "$REQ_HASH" ]; then
              /home/MAHMUD/agent-venv/bin/pip install -r requirements.agent.txt --quiet
              echo "$REQ_HASH" > "$HASH_FILE"
            fi

            # Install/refresh the systemd unit so the worker auto-restarts on
            # crash, OOM, or reboot.
            sudo cp deploy/ielts-speaking-agent.service /etc/systemd/system/ielts-speaking-agent.service
            sudo systemctl daemon-reload
            sudo systemctl enable ielts-speaking-agent

            # Stop the managed service, then free port 8081 if a stale worker is
            # still holding it (e.g. an old nohup process outside systemd's
            # cgroup) — otherwise the new worker crashes with EADDRINUSE. Kill by
            # PORT, not by name: matching "-f speaking_agent.py" also matches this
            # deploy shell (the script contains that string) and SIGTERMs the SSH
            # session.
            sudo systemctl stop ielts-speaking-agent 2>/dev/null || true
            sudo fuser -k 8081/tcp 2>/dev/null || true
            rm -f /tmp/agent.pid
            sleep 3

            sudo systemctl reset-failed ielts-speaking-agent || true
            sudo systemctl start ielts-speaking-agent

            # Let it settle, then require an actually-running main process. A
            # flapping/auto-restarting service must fail the deploy, not pass.
            sleep 6
            state=$(systemctl show -p SubState --value ielts-speaking-agent)
            pid=$(systemctl show -p MainPID --value ielts-speaking-agent)
            if [ "$state" = "running" ] && [ "$pid" != "0" ]; then
              echo "Speaking agent active (PID $pid)"
            else
              echo "Speaking agent not healthy (SubState=$state MainPID=$pid); recent logs:"
              sudo journalctl -u ielts-speaking-agent -n 40 --no-pager || true
              exit 1
            fi
